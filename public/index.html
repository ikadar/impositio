    <script language="JavaScript">

      const parse = () => {
          const textualExplanation = document.getElementById("textual-explanation");
          textualExplanation.innerHTML = "";

          // Parse JSON payload from textarea
          let payload;
          try {
              payload = JSON.parse(document.getElementById('input').value);
          } catch (e) {
              textualExplanation.innerHTML = "Invalid JSON: " + e.message;
              console.error('Invalid JSON:', e);
              return;
          }

          // Send directly to /process endpoint (1-round flow)
          fetch('/process', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
          })
          .then(async response => {
              const data = await response.json();
              if (!response.ok) {
                  // Server returned 4xx or 5xx status
                  throw new Error(data.error || data.detail || 'Unknown error');
              }
              return data;
          })
          .then(data => {
              // data is now the full response (array of jobs with parts and actionPaths)
              calculatedData = data;

              // Display results
              for (let i = 0; i < data.length; i++) {
                  displayAllTextualExplanation(data[i], data[i].metaData.jobNumber);
              }
          })
          .catch(error => {
              console.error('Error loading JSON or server error:');
              console.log(error.message);
              textualExplanation.innerHTML = error.message;
          });
      }


      const toggleDetails = (uuid) => {
          console.log(uuid);
            const el = document.getElementById(uuid);
          console.log(el);
            if (el.style.display === 'block') {
                el.style.display = 'none';
            } else {
                el.style.display = 'block';
            }
        };
    </script>
